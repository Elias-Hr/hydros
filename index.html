<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#10242E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Hydros Annecy — Semaine type 2026/2027</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10242E;
  --paper:#EEF3F3;
  --surface:#FFFFFF;
  --line:#D5E0E0;
  --muted:#5B7480;
  --nat:#1B7FA6;
  --cap:#C13B22;
  --velo:#2E7D4F;
  --accent:#1B7FA6;
  --radius:14px;
  --shadow:0 1px 0 rgba(16,36,46,.06), 0 6px 18px -12px rgba(16,36,46,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#EEF3F3;
  background:var(--paper);
  color:#10242E;
  color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Inter",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ---------- Barre haute ---------- */
.topbar{background:#10242E;background:var(--ink);color:#EAF2F2;padding:14px 0 12px}
.topbar .wrap{display:-webkit-box;display:-ms-flexbox;display:flex;-ms-flex-align:baseline;align-items:baseline;
  -ms-flex-pack:justify;justify-content:space-between;gap:12px;-ms-flex-wrap:wrap;flex-wrap:wrap}
.club{font-family:"Bricolage Grotesque","Inter",Helvetica,Arial,sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.season{font-size:.78rem;color:#9FBAC2}
.seasontoggle{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.seasontoggle button{background:none;border:0;color:#BBD2D8;padding:5px 11px;border-radius:999px;font-size:.78rem;font-weight:500}
.seasontoggle button[aria-pressed="true"]{background:#EAF2F2;color:#10242E;font-weight:600}

/* ---------- Navigation sports ---------- */
nav.sports{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:#EEF3F3;background:rgba(238,243,243,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:1080px;margin:0 auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  padding:8px 14px;border-radius:999px;font-size:.87rem;font-weight:500;display:flex;align-items:center;gap:7px}
.tab .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.tab[data-route="natation"]{color:#1B7FA6} .tab[data-route="cap"]{color:#C13B22}
.tab[data-route="velo"]{color:#2E7D4F}
.tab[data-route="libre"]{color:#0E8C8B}
.tab[aria-current="page"]{background:#10242E;color:#fff;border-color:#10242E}

/* ---------- Prochaine séance ---------- */
.next{margin:18px 0 6px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.next-top{padding:16px 18px 14px;border-left:6px solid var(--accent)}
.next-label{font-size:.74rem;color:var(--muted);font-weight:500}
.next-title{font-size:1.5rem;margin:2px 0 6px;line-height:1.15}
.count{font-family:"Bricolage Grotesque","Inter",Helvetica,Arial,sans-serif;font-weight:800;font-size:2.4rem;line-height:1.05;
  font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.03em}
.count small{font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0;display:block;margin-top:4px}
.next-meta{font-size:.9rem;color:var(--muted);margin-top:10px}
.next-meta b{color:var(--ink);font-weight:600}
.next-kit{padding:12px 18px;background:#F6F9F9;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.next-kit b{color:var(--ink);font-weight:600}

/* ---------- Semaine ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.section-head h2{font-size:1.15rem}
.week{display:grid;gap:10px}
@media(min-width:920px){.week{grid-template-columns:repeat(7,1fr);align-items:start}}
.day{background:var(--surface);border-radius:var(--radius);padding:10px 12px 12px;box-shadow:var(--shadow)}
.day.today{outline:2px solid var(--ink)}
.day h3{font-size:.9rem;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.day h3 em{font-style:normal;font-size:.7rem;font-weight:600;color:#fff;background:var(--ink);
  padding:2px 7px;border-radius:999px;font-family:"Inter",Helvetica,Arial,sans-serif}
.slot{display:flex;align-items:stretch;gap:6px;border-left:4px solid var(--s);background:var(--bg);
  border-radius:8px;margin-bottom:7px;overflow:hidden}
.slot:last-child{margin-bottom:0}
.slot .body{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px 4px 8px 10px;color:var(--ink)}
.slot .h{font-size:.76rem;font-weight:600;color:var(--s);font-variant-numeric:tabular-nums}
.slot .n{font-size:.92rem;font-weight:600;margin-top:1px}
.slot .l{font-size:.76rem;color:var(--muted);margin-top:1px}
.slot .prog{font-size:.8rem;color:var(--ink);margin-top:5px;line-height:1.4}
.slot .rem{font-size:.76rem;color:var(--muted);margin-top:4px;font-style:italic}
.rpe{display:inline-block;font-size:.68rem;font-weight:700;background:var(--s,#10242E);
  color:#fff;padding:1px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.next-meta .rpe{background:var(--accent)}
.slot .pin{flex:none;width:42px;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:var(--s);font-size:1.05rem;border-left:1px solid rgba(16,36,46,.08)}
.slot.done{opacity:.55}
.slot.done .n{text-decoration:line-through}
.empty{font-size:.82rem;color:var(--muted);padding:6px 2px}

/* ---------- Fiches sport ---------- */
.sport-head{margin:20px 0 4px;padding:18px;border-radius:var(--radius);background:var(--surface);
  border-left:6px solid var(--accent);box-shadow:var(--shadow)}
.sport-head h1{font-size:1.7rem;color:var(--accent)}
.sport-head p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:14px}
.card h2{font-size:1.02rem;margin-bottom:10px}
.card ul{margin:0;padding-left:1.1em}
.card li{margin-bottom:6px;font-size:.92rem}
.card li:last-child{margin-bottom:0}
.slots-list{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.check:last-of-type{border-bottom:0}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check span.on{text-decoration:line-through;color:var(--muted)}
.place{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.place:last-of-type{border-bottom:0}
.place .info{flex:1;min-width:0}
.place .nm{font-weight:600}
.place .ad{font-size:.79rem;color:var(--muted)}

/* ---------- Contacts ---------- */
.contact{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.contact:last-of-type{border-bottom:0}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--bg);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:"Bricolage Grotesque","Inter",Helvetica,Arial,sans-serif;font-size:.95rem}
.contact .info{flex:1;min-width:0}
.contact .nm{font-weight:600;font-size:.95rem}
.contact .rl{font-size:.79rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact .acts{display:flex;gap:6px;flex:none}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;text-decoration:none;color:var(--ink)}
.icon.wa{border-color:#25D366;color:#128C4A}
.icon.del{color:#B23A2C}
form.add{display:grid;gap:8px;margin-top:12px}
@media(min-width:640px){form.add{grid-template-columns:1fr 1fr 1fr auto}}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#FAFCFC;color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:88px;resize:vertical}
.btn{border:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;
  text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:.79rem;color:var(--muted);margin-top:8px}

/* ---------- Volume ---------- */
.bars{display:grid;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:.85rem}
.track{height:9px;background:#E6EDED;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

.modal-back{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(16,36,46,.55);z-index:80;
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-back{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(16,36,46,.35);overflow:hidden}
@media(min-width:640px){.modal{border-radius:18px}}
.mhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;
  border-left:6px solid var(--accent)}
.mhead h2{font-size:1.15rem}
.mhead .sub{font-size:.82rem;color:var(--muted);margin-top:3px}
.mhead .x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1rem}
.mbody{padding:14px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mbody h3{font-size:.95rem;margin:16px 0 6px}
.mbody h3:first-child{margin-top:0}
.mfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;background:#F6F9F9}
.mfoot .btn{flex:1 1 auto}
.mprog{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.mprog b{color:var(--accent)}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.pitem:last-child{border-bottom:0}
.pitem input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pitem span{flex:1}
.pitem span.on{text-decoration:line-through;color:var(--muted)}
.pitem .rm{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  color:#B23A2C;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.tagperso{font-size:.66rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);
  border-radius:999px;padding:0 6px;flex:none}
.rowadd{display:flex;gap:8px;margin-top:10px}
.rowadd input{flex:1}
.jrn{border-left:3px solid var(--accent);background:#F6F9F9;border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:8px}
.jrn .d{font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.jrn .t{font-size:.9rem;margin-top:3px;white-space:pre-wrap}
.jrn button{border:0;background:none;color:#B23A2C;font-size:.75rem;padding:0}
.tl-axe{position:relative;height:16px;margin:0 0 4px;font-size:.68rem;color:var(--muted)}
.tl-x{position:absolute;transform:translateX(-50%)}
.tl-x:first-child{transform:none}
.tl-x:last-child{transform:translateX(-100%)}
.tl-day{padding:8px 0;border-bottom:1px solid var(--line)}
.tl-day:last-child{border-bottom:0}
.tl-day.cible{background:var(--bg,rgba(14,140,139,.07));border-radius:8px;padding:8px 8px;margin:0 -8px}
.tl-h{font-size:.85rem;font-weight:600;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.tl-h em{font-style:normal;font-size:.66rem;font-weight:700;color:#fff;background:var(--accent);padding:1px 7px;border-radius:999px}
.tl-h span{font-weight:400;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-track{position:relative;height:14px;background:#E6EDED;border-radius:4px;margin-bottom:3px}
.tl-track.club{height:7px;background:#EFF3F3}
.tl-b{position:absolute;top:0;bottom:0;border-radius:4px;min-width:3px}
.tl-b.pub{background:var(--accent)}
.tl-spe{font-size:.72rem;color:var(--muted);margin-top:3px}
.tl-spe.alerte{color:#B23A2C}
.opt{border-left:3px solid var(--accent);padding:8px 0 8px 12px;margin-bottom:12px}
.opt:last-of-type{margin-bottom:0}
.opt-h{font-size:.95rem;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt-h b{font-weight:600;color:var(--accent);font-size:.82rem;font-variant-numeric:tabular-nums}
.opt-t{font-size:.86rem;color:var(--ink);margin-top:3px}
.opt-m{font-size:.74rem;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);bottom:18px;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:.87rem;
  box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;-webkit-transition:opacity .2s;transition:opacity .2s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{-webkit-transition:none!important;transition:none!important;animation:none!important}}
footer{color:var(--muted);font-size:.78rem;margin:28px 0 8px;text-align:center}
@media print{nav.sports,.btnrow,form.add,.icon,.slot .pin{display:none}body{background:#fff}}
</style>
</head>

/* =======================  Stockage (window.storage → localStorage → mémoire)  ======================= */
